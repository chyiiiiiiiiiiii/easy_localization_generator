name: easy_localization_generator
description: Generates the localization keys from an online Google Sheet or a local csv file.
version: 0.3.5
homepage: https://github.com/chyiiiiiiiiiiii/easy_localization_generator
issue_tracker: https://github.com/chyiiiiiiiiiiii/easy_localization_generator/issues

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  build: ^4.0.0
  build_config: ^1.1.1
  source_gen: ^4.1.1
  http: ^1.2.2
  path: ^1.9.0
  csv: ^6.0.0
  intl: ^0.19.0
  analyzer: ^8.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0

